name: CI - Gestion de Equipos

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Compilar y ejecutar pruebas
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 25
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "25"
          cache: "maven"

      - name: Compilar, ejecutar pruebas y generar cobertura
        run: mvn -B "-Dtest=EquipoServiceImplTest,EquipoControllerTest" clean verify

      - name: Analizar codigo con SonarQube Cloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=AndyMorales8748544_gestion-equipos-tecnologicos
          -Dsonar.organization=andymorales8748544
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
